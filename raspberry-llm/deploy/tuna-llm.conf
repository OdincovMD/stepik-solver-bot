# Drop-in for the existing tuna-http-100.service (retired skin website).
# The dashboard's tuna-http-8080.service is not changed.
[Unit]
Wants=raspberry-llm-gateway.service
After=raspberry-llm-gateway.service

[Service]
WorkingDirectory=/home/admin/projects/raspberry-llm
ExecStart=
ExecStart=/usr/bin/tuna http 127.0.0.1:18085 --domain=skin-cancer-ai.ru --inspect=false --https-redirect --log-level=warn
